# dsh-usage-panel bundle patch
#
# Applied as a profile bundle layer (through the `dsh.bundle.patch` manifest
# field). It inserts the one Loader row that owns both halves: the Node half
# (lib/index.js — credentials, the DeepSeek balance probe, the local usage
# ledger and the loopback-only JSON route family) and the browser half
# (lib/client.js — the sidebar "用量" panel), which the client module system
# discovers from `dsh.client` in package.json.
- insert:
    - id: usage-panel
      name: 'dsh-usage-panel'
